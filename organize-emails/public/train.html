<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email trainer</title>
<style>
  :root { --bg:#fafaf9; --card:#fff; --ink:#1c1917; --mute:#78716c; --line:#e7e5e4; --ok:#15803d; --bad:#b91c1c; --accent:#1d4ed8; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#161513; --card:#1f1d1b; --ink:#f5f5f4; --mute:#a8a29e; --line:#33302d; --ok:#4ade80; --bad:#f87171; --accent:#60a5fa; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
  header { display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; padding:12px 24px; border-bottom:1px solid var(--line); background:var(--card); }
  select, button, textarea { font:inherit; color:inherit; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 12px; }
  button { cursor:pointer; }
  button:hover { border-color:var(--mute); }
  .stat { color:var(--mute); } .stat b { color:var(--ink); font-weight:600; }
  main { display:grid; grid-template-columns:minmax(0,3fr) minmax(280px,2fr); gap:20px; max-width:1200px; margin:20px auto; padding:0 24px; }
  @media (max-width:800px) { main { grid-template-columns:1fr; } }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; }
  h2 { margin:0 0 4px; font-size:18px; }
  .meta { color:var(--mute); font-size:13px; margin-bottom:12px; }
  pre { white-space:pre-wrap; word-break:break-word; font:inherit; margin:0; max-height:60vh; overflow:auto; }
  .call { font-size:20px; font-weight:600; margin:0 0 4px; }
  .reason { color:var(--mute); margin-bottom:16px; }
  .bar { display:block; height:6px; margin-top:6px; border-radius:3px; background:var(--line); }
  .bar i { display:block; height:100%; border-radius:3px; background:var(--accent); }
  .row { display:flex; gap:8px; margin-bottom:12px; }
  .row button { flex:1; font-weight:600; }
  button.lab { font-size:16px; padding:10px 12px; }
  button.lab.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.right.on { background:var(--ok); border-color:var(--ok); color:#fff; }
  button.wrong.on { background:var(--bad); border-color:var(--bad); color:#fff; }
  button.skip.on { background:var(--mute); border-color:var(--mute); color:#fff; }
  textarea { width:100%; resize:vertical; min-height:80px; }
  kbd { font:12px monospace; border:1px solid var(--line); border-radius:4px; padding:0 4px; color:var(--mute); }
  .nav { display:flex; justify-content:space-between; align-items:center; margin-top:12px; color:var(--mute); font-size:13px; }
  .empty { max-width:560px; margin:80px auto; text-align:center; color:var(--mute); }
</style>
</head>
<body>
<header>
  <a href="/" class="stat" style="text-decoration:none">← Email organizer</a>
  <select id="run" aria-label="Run"></select>
  <select id="call" aria-label="Model says" title="Show only the emails the model called important, or only those it called not important, so you judge one kind at a time">
    <option value="all">Model says: all</option>
    <option value="1">Model says: important</option>
    <option value="0">Model says: not important</option>
  </select>
  <span class="stat" id="stats"></span>
  <label class="stat" title="Hide the emails you have already rated. Skipped emails stay in the list, since you haven't decided on them yet."><input type="checkbox" id="unrated"> unrated + skipped only</label>
  <button id="copy" style="margin-left:auto">Copy report for Opus</button>
</header>
<div id="app"></div>

<script>
const $ = (id) => document.getElementById(id);
const pct = (n) => (n * 100).toFixed(0) + '%';
let items = [], index = 0, runId = null;

const api = (path, options) => fetch('/api' + path, options).then((r) => r.ok ? r : Promise.reject(new Error(r.status)));
const label = (v) => v === null ? 'Model error' : v ? 'Important' : 'Not important';
const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' })[c]);

function showStats(m) {
  $('stats').innerHTML = `rated <b>${m.rated}/${m.total}</b> · agreement <b>${pct(m.agreement)}</b> · precision <b>${pct(m.precision)}</b> · recall <b>${pct(m.recall)}</b> · F1 <b>${pct(m.f1)}</b>${m.auc === null ? '' : ` · AUC <b>${pct(m.auc)}</b>`}`;
}

function visible() {
  // "unrated only" keeps skipped emails: skipping means you haven't decided yet
  const call = $('call').value;
  return items.filter((it) => it.result.important !== null && (call === 'all' || it.result.important === (call === '1')) && (!$('unrated').checked || !it.rating || it.rating.verdict === 'skip'));
}

function render() {
  const list = visible();
  if (list.length === 0) {
    $('app').innerHTML = `<div class="empty">${items.length ? 'Nothing left to rate in this run.' : 'No runs yet. Pull a batch and classify it:<br><br><code>npm run pull -- 2026-10-01</code><br><code>npm run classify -- &lt;batch-id&gt;</code>'}</div>`;
    return;
  }
  index = Math.min(Math.max(index, 0), list.length - 1);
  const { email, result, rating } = list[index];
  const on = (v) => rating?.verdict === v ? ' on' : '';
  // what the user said the email is, derived from their verdict on the model's call
  const said = !rating || rating.verdict === 'skip' ? null : rating.verdict === 'right' ? result.important : !result.important;
  const lab = (v) => said === v ? ' on' : '';

  $('app').innerHTML = `<main>
    <section class="card">
      <h2>${esc(email.subject)}</h2>
      <div class="meta">${esc(email.from)} · ${email.date.slice(0, 10)}</div>
      <pre>${esc(email.text || '(empty body)')}</pre>
    </section>
    <section class="card">
      <p class="call">${label(result.important)}</p>
      ${result.score === undefined ? `<p class="reason">${esc(result.reason)}</p>` : `<p class="reason">score ${result.score.toFixed(2)}<span class="bar"><i style="width:${result.score * 100}%"></i></span></p>`}
      <div class="row">
        <button class="lab${lab(true)}" data-l="1">Important <kbd>i</kbd></button>
        <button class="lab${lab(false)}" data-l="0">Not important <kbd>u</kbd></button>
      </div>
      <div class="row">
        <button class="right${on('right')}" data-v="right">Model right <kbd>y</kbd></button>
        <button class="wrong${on('wrong')}" data-v="wrong">Model wrong <kbd>n</kbd></button>
        <button class="skip${on('skip')}" data-v="skip">Skip <kbd>s</kbd></button>
      </div>
      ${rating?.inherited ? '<p class="meta">Already rated in another run of this batch.</p>' : ''}
      <textarea id="note" placeholder="Why? (optional, Opus reads this)">${esc(rating?.note ?? '')}</textarea>
      <div class="nav"><button id="prev">← prev</button><span>${index + 1} / ${list.length}</span><button id="next">next →</button></div>
    </section>
  </main>`;

  document.querySelectorAll('[data-v]').forEach((b) => b.onclick = () => rate(b.dataset.v, true));
  document.querySelectorAll('[data-l]').forEach((b) => b.onclick = () => say(b.dataset.l === '1'));
  $('note').onblur = () => rating && rate(rating.verdict, false);
  $('prev').onclick = () => { index--; render(); };
  $('next').onclick = () => { index++; render(); };
}

/** Rate by what the email is; stored as right/wrong against the model's call. */
function say(important) {
  rate(visible()[index].result.important === important ? 'right' : 'wrong', true);
}

async function rate(verdict, advance) {
  const list = visible();
  const item = list[index];
  const note = $('note').value;
  if (item.rating?.verdict === verdict && item.rating.note === note) return advance ? (index++, render()) : undefined;

  item.rating = { verdict, note };
  const metrics = await (await api(`/runs/${runId}/ratings/${item.email.id}`, {
    method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify(item.rating),
  })).json();
  showStats(metrics);
  // under the unrated filter a rated item leaves the list (so the index already points at the next one); a skipped item stays
  if (advance && (!$('unrated').checked || verdict === 'skip')) index++;
  render();
}

async function load(id) {
  runId = id;
  const data = await (await api('/runs/' + id)).json();
  items = data.items;
  const count = (v) => items.filter((it) => it.result.important === v).length;
  $('call').options[1].text = `Model says: important (${count(true)})`;
  $('call').options[2].text = `Model says: not important (${count(false)})`;
  index = 0;
  showStats(data.metrics);
  render();
}

async function init() {
  const runs = await (await api('/runs')).json();
  $('run').innerHTML = runs.map((r) => `<option value="${r.id}">${r.id.slice(0, 16).replace('T', ' ')} · ${r.model.split(':')[0]} · ${r.batch} · F1 ${pct(r.metrics.f1)}</option>`).join('');
  $('run').onchange = () => load($('run').value);
  $('unrated').onchange = () => { index = 0; render(); };
  $('call').onchange = () => { index = 0; render(); };
  if (runs.length) load(runs[0].id); else render();
}

$('copy').onclick = async () => {
  const text = await (await api(`/runs/${runId}/report`)).text();
  await navigator.clipboard.writeText(text);
  $('copy').textContent = 'Copied!';
  setTimeout(() => $('copy').textContent = 'Copy report for Opus', 1500);
};

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'TEXTAREA' || e.metaKey || e.ctrlKey || !runId) return;
  const key = { y: 'right', n: 'wrong', s: 'skip' }[e.key];
  if (key) rate(key, true);
  else if (e.key === 'i' || e.key === 'u') say(e.key === 'i');
  else if (e.key === 'ArrowRight') { index++; render(); }
  else if (e.key === 'ArrowLeft') { index--; render(); }
});

init();
</script>
</body>
</html>
